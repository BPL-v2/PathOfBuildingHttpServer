services:
  pob-poe1:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workdir
    environment:
      POB_ROOT: "/workdir/PathOfBuilding"
      LUA_PATH: "/workdir/PathOfBuilding/src/lua/?.lua;/workdir/PathOfBuilding/src/?.lua;;"
    restart: "no"

  pob-poe2:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workdir
    environment:
      POB_ROOT: "/workdir/PathOfBuilding-PoE2"
      LUA_PATH: "/workdir/PathOfBuilding-PoE2/src/lua/?.lua;/workdir/PathOfBuilding-PoE2/src/?.lua;;"
    restart: "no"

  pob-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - pob-poe1
      - pob-poe2
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: "no"
