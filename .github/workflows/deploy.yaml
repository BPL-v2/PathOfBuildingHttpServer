name: Build and Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: poe1
            pob_repository: PathOfBuildingCommunity/PathOfBuilding
          - game: poe2
            pob_repository: PathOfBuildingCommunity/PathOfBuilding-PoE2

    steps:
      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: app

      - name: Checkout latest PoB runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.pob_repository }}
          fetch-depth: 1
          path: pob
          sparse-checkout: |
            src
            runtime/lua
            manifest.xml
            manifest.cfg

      - name: Capture build metadata
        id: meta
        run: |
          echo "app_sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pob_sha=$(git -C pob rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pob_sha_short=$(git -C pob rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker build context
        run: |
          mkdir -p build-context/PathOfBuilding/runtime
          rsync -a app/CharacterImportServer.lua app/pob_server app/Dockerfile.headless build-context/
          rsync -a pob/src build-context/PathOfBuilding/
          rsync -a pob/runtime/lua build-context/PathOfBuilding/runtime/
          rsync -a pob/manifest.xml build-context/PathOfBuilding/
          if [ -f pob/manifest.cfg ]; then
            rsync -a pob/manifest.cfg build-context/PathOfBuilding/
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile.headless
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/pob-server:${{ matrix.game }}-latest
            ${{ vars.DOCKER_USERNAME }}/pob-server:${{ matrix.game }}-${{ steps.meta.outputs.pob_sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.app_sha }}
            org.opencontainers.image.version=${{ matrix.game }}-${{ steps.meta.outputs.pob_sha_short }}
            pob.repository=${{ matrix.pob_repository }}
            pob.revision=${{ steps.meta.outputs.pob_sha }}
          cache-from: type=gha,scope=${{ matrix.game }}
          cache-to: type=gha,mode=max,scope=${{ matrix.game }}

  notify-watchtower:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Notify watchtower
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "${SERVER_URL}" ] || [ -z "${WATCHTOWER_TOKEN}" ]; then
            echo "Skipping watchtower notification."
            exit 0
          fi
          curl -X POST "${SERVER_URL}/watchtower/v1/update" -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
