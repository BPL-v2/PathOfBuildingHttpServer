name: Build and Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: app

      - name: Checkout latest PoE1 runtime
        uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          fetch-depth: 1
          path: pob-poe1
          sparse-checkout: |
            src
            runtime/lua
            manifest.xml
            manifest.cfg

      - name: Checkout latest PoE2 runtime
        uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          fetch-depth: 1
          path: pob-poe2
          sparse-checkout: |
            src
            runtime/lua
            manifest.xml
            manifest.cfg

      - name: Capture build metadata
        id: meta
        run: |
          echo "app_sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "poe1_sha=$(git -C pob-poe1 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "poe2_sha=$(git -C pob-poe2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "poe1_sha_short=$(git -C pob-poe1 rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "poe2_sha_short=$(git -C pob-poe2 rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker build context
        run: |
          mkdir -p build-context/PathOfBuilding/runtime build-context/PathOfBuilding-PoE2/runtime
          rsync -a app/CharacterImportService.lua app/pob_wrapper app/Dockerfile app/go.mod app/go.sum app/*.go build-context/
          rsync -a pob-poe1/src build-context/PathOfBuilding/
          rsync -a pob-poe1/runtime/lua build-context/PathOfBuilding/runtime/
          rsync -a pob-poe1/manifest.xml build-context/PathOfBuilding/
          if [ -f pob-poe1/manifest.cfg ]; then
            rsync -a pob-poe1/manifest.cfg build-context/PathOfBuilding/
          fi
          rsync -a pob-poe2/src build-context/PathOfBuilding-PoE2/
          rsync -a pob-poe2/runtime/lua build-context/PathOfBuilding-PoE2/runtime/
          rsync -a pob-poe2/manifest.xml build-context/PathOfBuilding-PoE2/
          if [ -f pob-poe2/manifest.cfg ]; then
            rsync -a pob-poe2/manifest.cfg build-context/PathOfBuilding-PoE2/
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile
          push: false
          load: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/pob-server:latest
            ${{ vars.DOCKER_USERNAME }}/pob-server:poe1-${{ steps.meta.outputs.poe1_sha_short }}-poe2-${{ steps.meta.outputs.poe2_sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.app_sha }}
            pob.poe1.revision=${{ steps.meta.outputs.poe1_sha }}
            pob.poe2.revision=${{ steps.meta.outputs.poe2_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        working-directory: app
        env:
          POB_SMOKE_BASE_URL: http://localhost:8080
        run: |
          docker run -d --name smoketest -p 8080:8080 "${{ vars.DOCKER_USERNAME }}/pob-server:latest"
          trap 'docker logs smoketest || true; docker rm -f smoketest || true' EXIT
          go test -tags smoke ./... -run TestSmokeEndpoints -v

      - name: Push Docker image
        run: |
          docker push "${{ vars.DOCKER_USERNAME }}/pob-server:latest"
          docker push "${{ vars.DOCKER_USERNAME }}/pob-server:poe1-${{ steps.meta.outputs.poe1_sha_short }}-poe2-${{ steps.meta.outputs.poe2_sha_short }}"

  notify-watchtower:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Notify watchtower
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "${SERVER_URL}" ] || [ -z "${WATCHTOWER_TOKEN}" ]; then
            echo "Skipping watchtower notification."
            exit 0
          fi
          curl -X POST "${SERVER_URL}/watchtower/v1/update" -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
