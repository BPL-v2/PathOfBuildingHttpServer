events {}

http {
  upstream pob_poe1 {
    server pob-headless-poe1:8080;
  }

  upstream pob_poe2 {
    server pob-headless-poe2:8080;
  }

  server {
    listen 8080;
    server_name _;

    location /poe1/ {
      rewrite ^/poe1/(.*)$ /$1 break;
      proxy_pass http://pob_poe1;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /poe2/ {
      rewrite ^/poe2/(.*)$ /$1 break;
      proxy_pass http://pob_poe2;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
